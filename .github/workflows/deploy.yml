name: Deploy Frontend

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            cd /home/${{ secrets.EC2_USER }}/motorya-frontend
            OLD_LOCK_HASH=$(sha256sum package-lock.json 2>/dev/null | awk '{print $1}')
            git pull origin main
            NEW_LOCK_HASH=$(sha256sum package-lock.json 2>/dev/null | awk '{print $1}')
            if [ "$OLD_LOCK_HASH" != "$NEW_LOCK_HASH" ] || [ ! -d node_modules ]; then
              echo ">> lockfile changed or node_modules missing — running npm ci"
              npm ci --legacy-peer-deps --no-audit --no-fund
            else
              echo ">> lockfile unchanged — skipping npm ci"
            fi
            npm run build
            pm2 describe motorya-frontend > /dev/null 2>&1 \
              && pm2 restart motorya-frontend \
              || pm2 start node_modules/.bin/next --name motorya-frontend -- start -p 3001
            pm2 save
